name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The test suite exercises src/dataset.py, src/metrics.py, and the
      # portfolio/report scripts only — none of which import torch or
      # ultralytics — so CI installs just the light dependencies.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib pyyaml pillow tqdm numpy pytest

      - name: Run tests
        run: pytest -q
